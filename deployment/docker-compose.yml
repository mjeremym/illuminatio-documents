services:
  documentation:
    image: illuminatio/documents:${DOCUMENTATION_VERSION:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${DOCUMENTATION_PORT:-8088}:8080"
    secrets:
      - docs_htpasswd
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  docs_htpasswd:
    file: ../.secrets/docs.htpasswd
