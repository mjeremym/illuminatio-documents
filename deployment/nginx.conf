server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Illuminatio Documentation";
    auth_basic_user_file /run/secrets/docs_htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Release deployments publish the site below /documentation/. Local DEV
    # continues to use /. Strip the release prefix before resolving static files.
    location = /documentation {
        return 301 /documentation/;
    }

    # ^~ keeps the generic static-asset regex from intercepting prefixed files
    # before this location has removed the public release path.
    location ^~ /documentation/ {
        rewrite ^/documentation/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
